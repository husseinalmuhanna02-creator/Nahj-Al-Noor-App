      (function() {
        try {
          var saved = localStorage.getItem('nahj_al_nur_settings');
          if (saved) {
            var settings = JSON.parse(saved);
            if (settings.theme === 'dark') {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }
        } catch (e) {}
      })();
