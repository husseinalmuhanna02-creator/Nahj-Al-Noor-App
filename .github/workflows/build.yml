name: Deploy Final PWA
on: [push]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Zero-Fail Icon Copy
        id: webdir
        run: |
          WEB_DIR=$(grep webDir capacitor.config.ts | sed -E "s/.*webDir:\s*['\"](.*)['\"].*/\1/")
          TARGET_DIR=${WEB_DIR:-www}
          echo "dir=$TARGET_DIR" >> $GITHUB_OUTPUT
          
          # أخذ صورتك التي رفعتها ونسخها مباشرة بدون أي أدوات تعديل
          USER_LOGO=$(find . -name "applogo.png" -type f | head -n 1)
          if [ ! -z "$USER_LOGO" ]; then
            cp "$USER_LOGO" $TARGET_DIR/icon-192.png
            cp "$USER_LOGO" $TARGET_DIR/icon-512.png
          fi
          
          cd $TARGET_DIR
          
          # إصلاح المسارات
          sed -i 's|href="/|href="./|g' index.html || true
          sed -i 's|src="/|src="./|g' index.html || true
          
          # المانيفست
          cat << 'EOF_JSON' > manifest.json
          {
            "name": "Nahj Al-Noor",
            "short_name": "Nahj Al-Noor",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0d1117",
            "theme_color": "#0d1117",
            "icons": [
              {
                "src": "icon-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "icon-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }
          EOF_JSON
          
          # Service Worker
          cat << 'EOF_SW' > sw.js
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => self.clients.claim());
          self.addEventListener('fetch', e => {
            e.respondWith(fetch(e.request).catch(() => new Response('Offline')));
          });
          EOF_SW
          
          # حقن الأكواد
          sed -i '/<head>/a \    <link rel="manifest" href="./manifest.json">' index.html || true
          sed -i '/<head>/a \    <meta name="apple-mobile-web-app-capable" content="yes">' index.html || true
          sed -i '/<head>/a \    <link rel="apple-touch-icon" href="./icon-512.png">' index.html || true
          sed -i '/<body>/a \    <script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js");}</script>' index.html || true

      - name: Deploy Web to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ steps.webdir.outputs.dir }}
          branch: gh-pages
