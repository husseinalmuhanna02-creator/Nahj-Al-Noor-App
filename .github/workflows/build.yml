name: Build APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build Web
        run: npm run build
      - name: Setup Android Project
        run: |
          npm install @capacitor/android @capacitor/cli
          npx cap add android
      - name: Force Java 17 Compatibility
        run: |
          # استبدال شامل لإصدار 21 بـ 17 في جميع ملفات build.gradle
          find . -name "build.gradle" -exec sed -i 's/17/17/g' {} +
          find . -name "build.gradle" -exec sed -i 's/21/17/g' {} +
          echo "org.gradle.java.home=$JAVA_HOME" > android/gradle.properties
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          
